name: AllStar Optik Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dedicated repo
        uses: actions/checkout@v4
      - name: Unpack Android sources and answer database
        run: |
          base64 --decode build/source_v04_final_verified.zip.base64 > /tmp/allstar-source.zip
          # Extract only the validated private database. Never overwrite checked-in source fixes.
          unzip -j -o -q /tmp/allstar-source.zip app/src/main/assets/answers.sqlite -d app/src/main/assets
          test -s app/src/main/assets/answers.sqlite
          test -f app/src/main/java/com/optiklab/allstar/QrScannerActivity.java
          test -f app/build.gradle
      - name: Validate offline answer database
        run: python3 tools/verify_data.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline MathJax SVG engine
        run: |
          mkdir -p app/src/main/assets/mathjax
          npm pack mathjax-full@3.2.1 --silent > /tmp/mathjax-package-name.txt
          package_name="$(tail -n 1 /tmp/mathjax-package-name.txt)"
          mkdir -p /tmp/mathjax-package
          tar -xzf "$package_name" -C /tmp/mathjax-package
          cp /tmp/mathjax-package/package/es5/tex-svg.js app/src/main/assets/mathjax/tex-svg.js
          cp /tmp/mathjax-package/package/LICENSE app/src/main/assets/mathjax/LICENSE
          test -s app/src/main/assets/mathjax/tex-svg.js
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AllStar-Optik-v0.7-math-tutor-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
